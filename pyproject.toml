[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "assetforge-2d"
version = "0.5.0"
description = "Local cutout sprite animation plus deterministic validation and game-engine export."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
  "jsonschema>=4.21",
  "numpy>=1.24",
  "Pillow>=10",
]
keywords = ["game-development", "pixel-art", "godot", "asset-pipeline", "comfyui"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Games/Entertainment",
  "Topic :: Multimedia :: Graphics",
]

[project.urls]
Repository = "https://github.com/mindsurf0176-ui/assetforge"
Issues = "https://github.com/mindsurf0176-ui/assetforge/issues"

[project.scripts]
assetforge = "assetforge.cli:main"

[tool.setuptools.packages.find]
include = ["assetforge", "assetforge.profiles", "assetforge.schemas", "assetforge.workflows"]

[tool.setuptools.package-data]
assetforge = ["profiles/*.json", "schemas/*.json", "workflows/*.json"]
