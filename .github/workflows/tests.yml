name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .
      - run: assetforge --version
      - run: assetforge profiles
      - run: python -m unittest discover -s assetforge/tests -v

  wheel-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip build
      # The repository has a build/ artifact directory; run from /tmp so it
      # cannot shadow the `build` package's module entry point.
      - run: mkdir -p /tmp/assetforge-dist
      - run: cd /tmp && python -m build "$GITHUB_WORKSPACE" --outdir /tmp/assetforge-dist
      - run: python -m venv /tmp/assetforge-wheel-smoke
      - run: /tmp/assetforge-wheel-smoke/bin/python -m pip install /tmp/assetforge-dist/*.whl
      - run: cd /tmp && /tmp/assetforge-wheel-smoke/bin/assetforge --version
      - run: cd /tmp && /tmp/assetforge-wheel-smoke/bin/assetforge profiles
      - name: Verify packaged contracts
        run: >-
          cd /tmp && /tmp/assetforge-wheel-smoke/bin/python -c
          "from importlib.resources import files;
          root = files('assetforge');
          assert (root / 'profiles' / 'assetforge-profile.schema.json').is_file();
          assert (root / 'schemas' / 'rig-spec.schema.json').is_file();
          assert (root / 'schemas' / 'animation-spec.schema.json').is_file();
          assert (root / 'workflows' / 'sdxl-pixel-art-reference-api.json').is_file()"
