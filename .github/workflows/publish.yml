name: publish

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Ensure tag matches package version
        run: >-
          python -c
          "import pathlib, tomllib, os;
          version=tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'];
          tag=os.environ['GITHUB_REF_NAME'].removeprefix('v');
          assert tag == version, f'tag {tag} does not match package {version}'"
      - run: python -m pip install --upgrade pip build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - uses: pypa/gh-action-pypi-publish@release/v1
